[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zupload"
authors = [
  { name = "Zois Zogopoulos", email = "zois.zogopoulos@mgeo.lu.se" },
]
version = "0.1.0"
dependencies = [
    "halo",
    "h5netcdf",
    "icoscp_core",
    "netcdf4",
    "openpyxl",
    "pandas",
    "pyproj",
    "requests",
    "typer",
    "xarray",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
zupload = "zupload.zupload_cli:app"
try-ingest = "zupload.try_ingest_cli:app"
collection = "zupload.collection_cli:app"
harvest = "zupload.harvest_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "ruff",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check src tests {args}"
lint-fix = "ruff check --fix src tests {args}"
format = "ruff format src tests {args}"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

# State the rule set explicitly so a newer ruff cannot change what "lint" means.
# These four are ruff's long-standing defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
